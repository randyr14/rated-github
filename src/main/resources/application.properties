spring.application.name=rated

# Local MySQL connection (MAMP default configuration)
spring.datasource.url=${RATED_DB_URL:jdbc:mysql://localhost:8889/rated?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${RATED_DB_USERNAME:root}
spring.datasource.password=${RATED_DB_PASSWORD:}

# The media_entries table is already created in MySQL Workbench.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
