
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${entry.title} + ' — Rated'">Rated</title>

    <!-- Bootstrap and our custom stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <!-- Navigation bar -->
    <header class="topbar">
        <div class="container topbar-inner">

            <!-- Custom Rated logo -->
            <a class="logo" th:href="@{/}" aria-label="Rated Home">
                <img th:src="@{/images/rated-logo.png}"
                     alt="Rated"
                     height="40"
                     style="display:block; width:auto; max-width:170px; object-fit:contain;">
            </a>

            <a class="subtle-link" th:href="@{/}">
                Back to Library
            </a>

        </div>
    </header>

    <main class="container page-content narrow">

        <!-- Selected entry information -->
        <div class="details-heading">

            <div>

                <!-- Media type label -->
                <span class="type-pill"
                      th:classappend="${entry.mediaType == 'Movie' ? 'type-movie' : (entry.mediaType == 'TV Show' ? 'type-tv' : 'type-album')}"
                      th:text="${entry.mediaType}">
                    Movie
                </span>

                <!-- Title and creator -->
                <h1 th:text="${entry.title}">Title</h1>

                <p th:text="${entry.creator != null and !entry.creator.isBlank() ? entry.creator : 'No creator listed'}">
                    Creator
                </p>

            </div>

            <!-- Rating -->
            <span class="big-score">
                <strong th:text="${entry.rating}">9</strong>/10
            </span>

        </div>

        <!-- Entry details -->
        <div class="form-panel">

            <div class="row g-4">

                <!-- Release year -->
                <div class="col-sm-6">

                    <div class="detail-label">Release Year</div>

                    <div class="detail-value"
                         th:text="${entry.releaseYear != null ? entry.releaseYear : 'Not provided'}">
                        2025
                    </div>

                </div>

                <!-- Date finished -->
                <div class="col-sm-6">

                    <div class="detail-label">Date Finished</div>

                    <div class="detail-value"
                         th:text="${entry.dateConsumed != null ? entry.dateConsumed : 'Not provided'}">
                        Date
                    </div>

                </div>

                <!-- Review or notes -->
                <div class="col-12">

                    <div class="detail-label">Review / Notes</div>

                    <div class="review-text"
                         th:text="${entry.review != null and !entry.review.isBlank() ? entry.review : 'No review added.'}">
                        Review
                    </div>

                </div>

            </div>

            <!-- Entry actions -->
            <div class="form-actions">

                <a class="button-primary"
                   th:href="@{/entries/{id}/edit(id=${entry.mediaId})}">
                    Edit Entry
                </a>

                <!-- Ask before deleting an entry -->
                <form th:action="@{/entries/{id}/delete(id=${entry.mediaId})}"
                      method="post"
                      onsubmit="return confirm('Delete this entry?');">

                    <button class="button-danger" type="submit">
                        Delete Entry
                    </button>

                </form>

                <a class="button-secondary" th:href="@{/}">
                    Back
                </a>

            </div>

        </div>

    </main>

</body>
</html>
